plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.mexusbg.leicaframes'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.mexusbg.leicaframes'
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Modern Xposed API (libxposed) — compileOnly: provided by LSPOSED at runtime,
    // must NOT be bundled. Requires an LSPOSED that supports API 100+.
    compileOnly 'io.github.libxposed:api:102.0.0'

    // DexKit — runtime bytecode search, to locate obfuscated camera watermark
    // provider methods (non-ASCII class/method names) that can't be hooked by name.
    implementation 'org.luckypray:dexkit:2.0.6'
    // DexKit's API is Kotlin; the stdlib is needed on the (Java) compile classpath.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}
