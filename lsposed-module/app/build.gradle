plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.mexusbg.leicaframes'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.mexusbg.leicaframes'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed API — compileOnly: provided by the LSPOSED framework at runtime,
    // must NOT be bundled into the APK.
    compileOnly 'de.robv.android.xposed:api:82'

    // DexKit — runtime bytecode search, to locate obfuscated camera watermark
    // provider methods (non-ASCII class/method names) that can't be hooked by name.
    implementation 'org.luckypray:dexkit:2.0.6'
    // DexKit's API is Kotlin; the stdlib is needed on the (Java) compile classpath.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}
